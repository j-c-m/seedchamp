[package]
name = "seedchamp-engine"
version = "1.0.0"
edition = "2021"
description = "BitTorrent engine: catalog, disk, protocol (seedchamp)"
license = "MIT"

[dependencies]
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "registry", "env-filter"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha1 = "0.11"
hex = "0.4"
num-bigint = "0.5"
num-traits = "0.2"
rand = "0.10"
bytes = "1"
# Held at 0.29 on purpose (do not bump alone):
#   - root binary pins ctrlc ~3.4.6 so SIGINT handling uses the same 0.29
# Bumping to 0.30/0.31 without ctrlc alignment re-splits the lock.
nix = { version = "0.29", features = ["uio", "fs", "zerocopy"] }
socket2 = "0.6"
url = "2"
# HTTP(S): tracker announce + rare .torrent URL fetch on Compio (cyper / hyper).
# rustls + hickory-dns (Compio UDP DNS, no getaddrinfo spawn_blocking).
# Thread-local Client / Resolver on seedchamp-trk (cyper Client is !Send/!Sync).
cyper = { version = "0.9", default-features = false, features = ["rustls", "hickory-dns"] }
# Same DNS stack cyper uses for `hickory-dns` — shared for UDP announce resolve.
cyper-hickory = "0.1"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config"] }
# Process-level CryptoProvider for cyper HTTPS. Without ring (or aws-lc-rs),
# rustls panics on Client::build ("Could not automatically determine…").
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
futures = { version = "0.3", default-features = false, features = ["std", "executor", "async-await"] }
futures-channel = "0.3"
flume = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
# Local calendar dates for watch dl_path placeholders ({date}, etc.)
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }
# Process metrics for TUI Status (RSS/CPU/FDs/I/O). system only — no disks/net/users/rayon.
# Sample only while Status is open (≤1 Hz, TUI thread). See process_metrics.rs.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Peer worker count default = available_parallelism()

# Peer pool: Compio accept + N workers (least-peers). Peer seed fill: Compio fs.
compio = { version = "0.19", features = [
    "macros",
    "runtime",
    "net",
    "time",
    "io",
    "fs",
    "dispatcher",
    "io-uring",
] }

# FreeBSD DiskWorker AIO (writes).
[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# Linux DiskWorker piece writes via io_uring (fallback: thread + pwrite).
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "disk_write_bench"
path = "examples/disk_write_bench.rs"
