[workspace]
resolver = "2"
members = [
    ".",
    "crates/engine",
    "crates/tui",
    "crates/import",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
# Peer / session / control surfaces take many explicit parameters by design.
too_many_arguments = "allow"
# Channel and hot-path tuples are clearer inline than a swarm of type aliases.
type_complexity = "allow"

[package]
name = "seedchamp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mass seeder + high-speed leech BitTorrent TUI (greenfield, SQLite catalog)"
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "seedchamp"
path = "src/main.rs"

[dependencies]
seedchamp-engine = { path = "crates/engine" }
seedchamp-tui = { path = "crates/tui" }
seedchamp-import = { path = "crates/import" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
# Held at ~3.4.6 on purpose (do not bump to 3.5+ without checking nix):
#   ctrlc 3.4.x → nix ^0.29
#   ctrlc 3.5.0–3.5.1 → nix ^0.30
#   ctrlc 3.5.2+ → nix ^0.31
# seedchamp-engine is on nix 0.29; a newer ctrlc would reintroduce a dual nix
# in the lockfile. Bump only when engine can move to the same nix major/minor.
ctrlc = "~3.4.6"
