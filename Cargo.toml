[workspace]
resolver = "2"
members = [
    ".",
    "crates/engine",
    "crates/tui",
    "crates/import",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
# Peer / session / control surfaces take many explicit parameters by design.
too_many_arguments = "allow"
# Channel and hot-path tuples are clearer inline than a swarm of type aliases.
type_complexity = "allow"

[package]
name = "seedchamp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mass seeder + high-speed leech BitTorrent TUI (greenfield, SQLite catalog)"
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "seedchamp"
path = "src/main.rs"

[dependencies]
seedchamp-engine = { path = "crates/engine" }
seedchamp-tui = { path = "crates/tui" }
seedchamp-import = { path = "crates/import" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ctrlc = "3.5"
